name: University Admissions Bot Runner

on:
  schedule:
    # Lịch chạy tự động theo giờ UTC (Giờ Việt Nam = UTC + 7)
    # 7:30 sáng VN -> 0:30 UTC
    - cron: '30 0 * * *'
    # 15:00 chiều VN -> 8:00 UTC
    - cron: '0 8 * * *'

  # Cho phép bạn bấm nút chạy thủ công (Run workflow) bất cứ lúc nào trên web GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python university_bot.py
