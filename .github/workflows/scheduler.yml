name: University Admissions Bot Runner

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 11 * * *'
  
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai telegraph

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python university_bot.py

      - name: Commit updated sent_links.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Update sent links history"
          file_pattern: "sent_links.json"
